<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>מודעות מצבית: אחרי הרעש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Karantina:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <header id="top">
    <div class="logo-slot" id="logoSlot"><img src="images/logo.png" alt="לוגו"></div>
    <div class="titlewrap">
      <h1 data-fit="770">סכנות לאחר רעידת אדמה</h1>
    </div>
  </header>

  <p id="second-title-screen" class="sub">לחצו על הסכנות שאתם מזהים בתמונה</p>

  <section id="controls">
    <button id="hintBtn" type="button" aria-label="רמז">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 6c-10 0-18 7.6-18 17 0 6.2 3.2 10.6 6.6 14 1.9 1.9 3 4 3 6.4V46h16.8v-2.6c0-2.4 1.1-4.5 3-6.4C46.800 33.600 50 29.200 50 23 50 13.600 42 6 32 6z" fill="#111"/>
        <rect x="23" y="50" width="18" height="5" rx="2.500" fill="#111"/><rect x="26" y="57" width="12" height="4" rx="2" fill="#111"/>
      </svg>
      <span data-fit="150">רמז</span><span id="hintCount"></span>
    </button>
    <div id="timerBox" class="box">
      <div id="timerVal" data-fit="165">00:00</div>
      <div class="tctl"><span>טיימר</span>
        <button id="timerToggle" type="button" role="switch" aria-checked="true" aria-label="הפעלה וכיבוי של הטיימר"><i class="knob"></i></button>
      </div>
    </div>
    <div id="progress" class="box"><div id="ptext">נמצאו 0 מתוך 0 סכנות</div><div class="pbar"><i id="pfill"></i></div></div>
  </section>

  <nav id="nav">
    <button id="prevBtn" class="navbtn ghost" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg><span data-fit="235">תרחיש קודם</span>
    </button>
    <div id="scenInfo"><b id="scenNum"></b><span id="scenName"></span></div>
    <button id="nextBtn" class="navbtn primary" type="button">
      <span id="nextLabel" data-fit="235">תרחיש הבא</span><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </nav>

  <main id="imgwrap">
    <div id="imgbox">
      <img id="scenImg" alt="תרחיש לאחר רעידת אדמה" draggable="false">
      <div id="spots"></div>
      <div id="marks"></div>
      <div id="doneBanner">✓ זיהיתם את כל הסכנות בתרחיש! אפשר להמשיך כשתהיו מוכנים</div>
    </div>
  </main>

  <div id="overlay" aria-hidden="true"></div>
    <button id="fsBtn" type="button" aria-label="מסך מלא">
    <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
    <div id="startScreen">
    <div class="start-in">
      <img src="images/logo.png" alt="לוגו" class="start-logo">
      <h2>סכנות לאחר רעידת אדמה</h2>
      <p>זהו את כל הסכנות שמסתתרות בתמונות</p>
      <button id="startBtn" type="button">התחלת תרגול</button>
      <div id="startNote"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
